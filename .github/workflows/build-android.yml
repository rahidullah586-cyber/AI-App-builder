name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Remove old android dir
        run: rm -rf android

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Configure signing & Kotlin
        run: |
          cd android
          # Generate debug keystore for release signing (self-signed)
          keytool -genkeypair -v -keystore release.keystore -alias zai -keyalg RSA -keysize 2048 -validity 10000 -storepass zaiapp123 -keypass zaiapp123 -dname "CN=Z AI, OU=Dev, O=ZAI, L=Islamabad, ST=ISB, C=PK"

          # Fix Kotlin version
          sed -i "s/kotlinVersion = findProperty.*/kotlinVersion = '1.9.25'/" build.gradle
          sed -i "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25\")/" build.gradle
          echo 'android.kotlinVersion=1.9.25' >> gradle.properties
          echo 'kotlinVersion=1.9.25' >> gradle.properties

          # Configure release signing
          cat >> app/build.gradle << 'EOF'
          android {
            signingConfigs {
              release {
                storeFile file('release.keystore')
                storePassword 'zaiapp123'
                keyAlias 'zai'
                keyPassword 'zaiapp123'
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
              }
            }
          }
          EOF

          # Create proguard rules
          cat > proguard-rules.pro << 'EOF'
          -keep class com.facebook.react.** { *; }
          -keep class expo.** { *; }
          -dontwarn com.facebook.**
          -keepattributes *Annotation*
          -keep class * extends com.facebook.react.bridge.NativeModule { *; }
          -keep class * extends com.facebook.react.bridge.ReactContextBaseJavaModule { *; }
          -keep class * extends com.facebook.react.uimanager.ViewGroupManager { *; }
          -keepclassmembers class * { <methods>; }
          EOF

      - name: Build Release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NODE_ENV: production

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Z AI App v1.1.0"
          body: |-
            ## Z AI - Android App (Lightweight)
            Release build | 5 Color Themes | Chat UI | WebView Mode

            ### Features
            - Native chat interface
            - WebView mode for full Z AI web experience
            - 5 attractive color themes (Indigo, Aurora, Sunset, Ocean, Rose)
            - Conversation history with search & pin
            - Persistent memory system
            - Dark/Light/System mode
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
