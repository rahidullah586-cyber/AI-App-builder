name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Remove old android dir
        run: rm -rf android

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Fix Kotlin + configure release signing
        run: |
          cd android

          # Fix Kotlin version
          sed -i "s/kotlinVersion = findProperty.*/kotlinVersion = '1.9.25'/" build.gradle
          sed -i "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25\")/" build.gradle
          echo 'android.kotlinVersion=1.9.25' >> gradle.properties
          echo 'kotlinVersion=1.9.25' >> gradle.properties

          # Inject release signing config into app/build.gradle
          # Use Python for reliable multi-line insertion
          python3 << 'PYEOF'
          import re

          with open('app/build.gradle', 'r') as f:
              content = f.read()

          # Replace the release buildType to use debug signing and disable minification
          # Find the release block inside buildTypes
          pattern = r'(release\s*\{[^}]*?)'
          replacement = r'''release {
                signingConfig signingConfigs.debug
                minifyEnabled false
                shrinkResources false
            '''

          # Only replace the first occurrence inside buildTypes
          content = re.sub(pattern, replacement, content, count=1)

          with open('app/build.gradle', 'w') as f:
              f.write(content)

          print('Release buildType updated successfully')
          PYEOF

          # Verify the change
          echo '=== Release buildType in app/build.gradle ==='
          grep -A 5 'release {' app/build.gradle | head -10

      - name: Build Release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NODE_ENV: production

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Z AI App v1.2.0"
          body: |-
            ## Z AI - Android App (Lightweight Release)
            Built with Expo | 5 Color Themes | Chat UI | WebView Mode

            ### Features
            - Native chat interface
            - WebView mode for full Z AI web experience
            - 5 color themes (Indigo, Aurora, Sunset, Ocean, Rose)
            - Conversation history
            - Dark/Light/System mode
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
