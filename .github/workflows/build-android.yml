name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Remove old android dir
        run: rm -rf android

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Fix Kotlin + configure release signing
        run: |
          cd android

          # Fix Kotlin version
          sed -i "s/kotlinVersion = findProperty.*/kotlinVersion = '1.9.25'/" build.gradle
          sed -i "s/classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')/classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25\")/" build.gradle
          echo 'android.kotlinVersion=1.9.25' >> gradle.properties
          echo 'kotlinVersion=1.9.25' >> gradle.properties

          # Make release use debug signing (avoids keystore generation issues)
          python3 << 'PYEOF'
          import re
          with open('app/build.gradle', 'r') as f:
              content = f.read()
          pattern = r'(release\s*\{[^}]*?)'
          replacement = '''release {
                signingConfig signingConfigs.debug
                minifyEnabled false
            '''
          content = re.sub(pattern, replacement, content, count=1)
          with open('app/build.gradle', 'w') as f:
              f.write(content)
          print('Release signing configured')
          PYEOF

      - name: Build Release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NODE_ENV: production

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Z AI App v2.0.0 - Real Z AI"
          body: |-
            ## Z AI - Real Android App

            This is the **real Z AI app** that connects to z.ai with your actual account.

            ### Features
            - Opens real Z AI web interface (z.ai)
            - Login with your real Z AI account
            - Full AI chat with all Z AI capabilities
            - Native bottom navigation bar
            - Back/forward/refresh controls
            - Pull to refresh
            - Share functionality
            - Dark theme

            ### How to use
            1. Download and install the APK
            2. Open the app
            3. Login to your Z AI account
            4. Start chatting with real AI!
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
